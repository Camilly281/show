<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>INGRESSO DO SHOW</title>
</head>
<body>

    <main class="container">
        <div class="icone">
            <img src="">
        </div>
            <h1>Compre seus ingressos</h1>
                <p>Preencha o formulário para terminar a compra</p>

                <form id="formulario">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>

                    <label for="email">Digite seu E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>

                    <label for="regiao">Qual região você vive?</label>
                    <select id="regiao">
                        <option value="">Selecione sua região</option>
                        <option value="São Paulo">São Paulo</option>
                        <option value="Rio de Janeiro">Rio de Janeiro</option>
                        <option value="Minas Gerais">Minas Gerais</option>
                        <option value="Bahia">Bahia</option>
                    </select>

                    <label for="mensagem">OBSERVAÇÕES:</label>
                    <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>

                    <button type="submit">INGRESSO COMPRADO</button>
                </form>
    </main>

    <script src="./mais.js"></script>
</body>
</html>
